beta: 0.5
bf16: true
dataset_mixer:
  YOUR_PATH_HERE
dataset_splits:
- train
- test
do_eval: true
eval_steps: 100
evaluation_strategy: steps
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-05
load_in_4bit: true
log_level: info
logging_steps: 10
lora_alpha: 32
lora_dropout: 0.05
lora_r: 32
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
lr_scheduler_type: cosine
max_length: 4096
max_prompt_length: 1024
model_name_or_path: YOUR_PATH_HERE
model_revision: main
num_train_epochs: 1
optim: adamw_torch
output_dir: YOUR_PATH_HERE
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
preprocessing_num_workers: 8
save_steps: 50
save_strategy: steps
seed: 42
tokenizer_name_or_path: YOUR_PATH_HERE
torch_dtype: bfloat16
use_flash_attention_2: true
use_peft: true
warmup_ratio: 0.1
