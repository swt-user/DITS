# LoRA arguments
load_in_4bit: true
use_peft: true
lora_r: 32
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

beta: 0.1
bf16: true
dataset_mixer:
  YOUR_PATH_HERE
dataset_splits:
- train
- test
do_eval: true
eval_steps: 100
evaluation_strategy: steps
gradient_accumulation_steps: 10
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-4
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
max_length: 4096
max_prompt_length: 1024
model_name_or_path: YOUR_PATH_HERE
# model_name_or_path: YOUR_PATH_HERE
model_revision: main
num_train_epochs: 1
optim: adamw_torch
output_dir: YOUR_PATH_HERE
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
preprocessing_num_workers: 8
save_strategy: 'no'
seed: 42
tokenizer_name_or_path: YOUR_PATH_HERE
torch_dtype: bfloat16
use_flash_attention_2: true
# warmup_ratio: 1
warmup_steps: 0
start_point: 0
end_point: 300
eval_num: 150
step_num: 5
